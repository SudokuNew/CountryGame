<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">More Territory Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1 id="title">More Territory Game</h1>
    </header>

    <main>
        <section id="startMenu">
            <button id="startButton" class="button_main">Start Game</button>
            <button id="optionsButton" class="button_main">Options</button>
        </section>
        <section id="settingMenu" hidden>
            <h2>Game Settings</h2>
            <section id="map_settings">
                <h3>Territory Size</h3>
                <button class="option_button" data-value="Small">Small</button>
                <button class="option_button" data-value="Medium">Medium</button>
                <button class="option_button" data-value="Large">Large</button>
            </section>
        </section>
    </main>
</body>

</html>
